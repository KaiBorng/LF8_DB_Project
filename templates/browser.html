<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>Datenbrowser – Dark Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        /* --------- DARK THEME --------- */
        :root{
            --bg: #0f172a;           /* slate-900 */
            --panel: #111827;        /* gray-900 */
            --panel-2:#0b1220;
            --border:#243045;        /* dark border */
            --text:#e5e7eb;          /* gray-200 */
            --muted:#94a3b8;         /* slate-400 */
            --accent:#60a5fa;        /* sky-400 */
            --accent-2:#93c5fd;      /* lighter accent */
            --danger:#ef4444;        /* red-500 */
            --success:#22c55e;       /* green-500 */
            --danger-bg:#2a1212;
            --success-bg:#0f2a17;
            --thead:#0b1732;         /* dark header row */
            --hover:#0f1b33;
            --chip:#0f213b;
            --input:#0b1220;
            --shadow: 0 6px 18px rgba(0,0,0,0.35);
        }
        * { box-sizing: border-box; }
        html,body { height:100%; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
            margin: 24px;
            background: var(--bg);
            color: var(--text);
        }
        h1 { margin: 0 0 12px 0; font-size: 22px; font-weight: 650; }

        /* Top Actions (Docs & ReDoc) */
        .top-actions{
            display:flex; gap:12px; align-items:center;
            margin: 8px 0 16px 0;
        }
        .top-actions .btn-link{
            display:inline-flex; align-items:center; gap:8px;
            padding:8px 12px; border-radius:8px; border:1px solid var(--border);
            background: var(--chip); color: var(--accent-2); text-decoration:none;
            box-shadow: var(--shadow);
            transition: filter .15s ease, border-color .15s ease;
        }
        .top-actions .btn-link:hover{ filter:brightness(1.05); border-color: var(--accent); }
        .top-actions .emoji{ font-size: 16px; }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .control-block {
            background: linear-gradient(180deg, var(--panel), var(--panel-2));
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            box-shadow: var(--shadow);
        }

        label { font-size: 13px; color: var(--muted); }
        select, input {
            font-size: 14px; color: var(--text); background: var(--input);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 8px 10px; outline: none; width: 100%;
        }
        select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(96,165,250,0.15); }

        .checkboxes {
            display: flex; flex-wrap: wrap; gap: 10px;
            max-height: 140px; overflow: auto; padding-right: 6px;
        }
        .checkboxes label {
            display: inline-flex; align-items: center; gap: 8px;
            border: 1px solid var(--border); border-radius: 16px;
            padding: 6px 10px; background: var(--chip); color: var(--text);
            user-select: none;
        }
        .checkboxes input[type="checkbox"] { accent-color: var(--accent); }

        .search-row { display: flex; gap: 8px; align-items: center; }
        .muted { color: var(--muted); font-size: 12px; }

        /* Add forms */
        .add-wrap { margin-bottom:16px; }
        .tabs { display:flex; gap:8px; margin-bottom:10px; }
        .tab {
            background: var(--chip); color: var(--text);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 6px 12px; cursor: pointer;
        }
        .tab.active { border-color: var(--accent); color: var(--accent-2); }
        .form-row { display:flex; gap:10px; flex-wrap:wrap; }
        .form-row > * { min-width:180px; flex:1; }
        .btn {
            padding:8px 12px; border-radius:8px;
            border: 1px solid var(--border);
            background: var(--chip); color: var(--text);
            cursor:pointer;
        }
        .btn.primary { border-color: var(--accent); color: var(--accent-2); }
        .btn.danger { border-color: #7f1d1d; color: var(--danger); }
        .btn:hover { filter: brightness(1.05); }
        .actions-col { width:1%; white-space:nowrap; }

        /* Messages */
        .msg { margin-bottom: 12px; padding: 10px 12px; border-radius: 8px; display:none; }
        .msg.ok { display:block; background: var(--success-bg); border:1px solid rgba(34,197,94,0.35); color: var(--success); }
        .msg.err { display:block; background: var(--danger-bg); border:1px solid rgba(239,68,68,0.35); color: var(--danger); }

        /* Filter-Chip */
        .filter-chip {
            display:none; align-items:center; gap:8px; margin-top:8px;
            background: var(--chip); border:1px solid var(--border); color: var(--text);
            padding:6px 10px; border-radius: 20px; width: fit-content;
        }
        .filter-chip .label { font-size: 13px; }
        .filter-chip .clear { cursor:pointer; border:none; background:transparent; color: var(--accent-2); }

        /* Table */
        .table-wrap { overflow:auto; border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
        table { border-collapse: collapse; width: 100%; }
        thead th {
            position: sticky; top: 0;
            background: var(--thead);
            color: var(--text);
            border-bottom: 1px solid var(--border);
            cursor: pointer; user-select: none;
            font-weight: 600;
        }
        th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; }
        tbody tr:hover td { background: var(--hover); }
        .sort-indicator { margin-left: 6px; color: var(--accent); }
        .no-data { padding: 18px; text-align: center; color: var(--muted); }

        /* Link-Stil für klickbare Namen in Zellen */
        .cell-link {
            color: var(--accent-2);
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            text-decoration: underline;
            font: inherit;
        }
    </style>
</head>
<body>
    <h1>Datenbrowser</h1>

    <!-- ✨ Neue Buttons für Docs & ReDoc (vor der Datenbank) -->
    <div class="top-actions">
        <a class="btn-link" href="/docs" target="_blank" rel="noopener">
            <span class="emoji">📘</span>
            <span>API Docs</span>
        </a>
        <a class="btn-link" href="/redoc" target="_blank" rel="noopener">
            <span class="emoji">📙</span>
            <span>ReDoc</span>
        </a>
    </div>

    <div id="msg" class="msg"></div>

    <div class="controls">
        <div class="control-block">
            <label for="table-select"><strong style="color:#cbd5e1;">Tabelle wählen</strong></label><br />
            <select id="table-select">
                {% if tables %}
                    {% for t in tables %}
                        <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                {% endif %}
            </select>
            <div id="active-filter" class="filter-chip">
                <span class="label" id="filter-label"></span>
                <button id="filter-clear" class="clear" title="Filter löschen">✕</button>
            </div>
        </div>
        <div class="control-block">
            <div class="search-row">
                <label for="search"><strong style="color:#cbd5e1;">Suche:</strong></label>
                <input type="text" id="search" placeholder="Suche in den sichtbaren Spalten…" />
            </div>
            <div class="muted" style="margin-top: 6px;">Tippe, um live zu filtern. Umlaute werden berücksichtigt.</div>
        </div>
        <div class="control-block" style="grid-column: 1 / -1;">
            <div style="margin-bottom: 8px; color:#cbd5e1;"><strong>Spalten auswählen</strong></div>
            <div id="checkboxes" class="checkboxes"></div>
        </div>
    </div>
    <div class="control-block add-wrap">
        <div class="tabs">
            <button class="tab active" data-entity="AUTO">Auto hinzufügen</button>
            <button class="tab" data-entity="HERSTELLER">Hersteller hinzufügen</button>
            <button class="tab" data-entity="BESITZER">Besitzer hinzufügen</button>
        </div>
        <div id="forms">
            <div id="form-AUTO" class="form-row"></div>
            <div id="form-HERSTELLER" class="form-row" style="display:none;"></div>
            <div id="form-BESITZER" class="form-row" style="display:none;"></div>
        </div>
        <div style="margin-top:10px;">
            <button id="add-btn" class="btn primary">Hinzufügen</button>
        </div>
    </div>
    <div class="table-wrap">
        <table id="data-table">
            <thead><tr id="thead-row"></tr></thead>
            <tbody id="tbody"></tbody>
        </table>
        <div id="no-data" class="no-data" style="display:none;">Keine Daten gefunden.</div>
    </div>
<script>
(function() {
    // ----- State -----
    let currentTable = null;      // sichtbare Tabelle in der Grid
    let addEntity = 'AUTO';       // Tab für Hinzufügen
    let rows = [];                // Daten der aktuellen Tabelle
    let visibleColumns = [];      // sichtbare Spalten
    let sortConfig = { key: null, direction: 'asc' };
    let searchTerm = '';

    // Externer Filter: nur für AUTO (Hersteller_ID oder Besitzer_ID)
    // { key: 'Hersteller_ID'|'Besitzer_ID', value: 1, label: 'Hersteller: BMW (ID 1)' }
    let externalFilter = null;

    // Caches für Namen (zur Anzeige schöner Labels & klickbarer Spalten in AUTO)
    const manufacturersCache = new Map(); // id -> name
    const ownersCache = new Map();        // id -> name

    const PK = { 'AUTO': 'Auto_ID', 'BESITZER': 'Besitzer_ID', 'HERSTELLER': 'Hersteller_ID' };

    // DOM
    const tableSelect   = document.getElementById('table-select');
    const searchInput   = document.getElementById('search');
    const checkboxesDiv = document.getElementById('checkboxes');
    const theadRow      = document.getElementById('thead-row');
    const tbody         = document.getElementById('tbody');
    const noDataDiv     = document.getElementById('no-data');
    const msg           = document.getElementById('msg');
    const filterChip    = document.getElementById('active-filter');
    const filterLabel   = document.getElementById('filter-label');
    const filterClear   = document.getElementById('filter-clear');

    const tabButtons      = Array.from(document.querySelectorAll('.tab'));
    const formAuto        = document.getElementById('form-AUTO');
    const formHersteller  = document.getElementById('form-HERSTELLER');
    const formBesitzer    = document.getElementById('form-BESITZER');
    const addBtn          = document.getElementById('add-btn');

    // ----- Utils -----
    const normalize = (v) => {
        if (v === null || v === undefined) return '';
        return String(v).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    };
    const isNumber = (v) => {
        if (v === null || v === undefined) return false;
        const n = Number(v);
        return !isNaN(n) && isFinite(n);
    };
    function compare(a, b, key, direction) {
        const va = a[key], vb = b[key];
        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;
        let res = 0;
        if (isNumber(va) && isNumber(vb)) res = Number(va) - Number(vb);
        else res = String(va).localeCompare(String(vb), 'de', { sensitivity: 'base' });
        return direction === 'asc' ? res : -res;
    }
    function debounce(fn, wait=220) { let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), wait); }; }
    function setMessage(text, ok=true) {
        msg.className = 'msg ' + (ok ? 'ok' : 'err');
        msg.textContent = text;
        msg.style.display = 'block';
        setTimeout(() => { msg.style.display = 'none'; }, 3200);
    }

    // ----- Filter-Chip -----
    function applyExternalFilterLabel() {
        if (externalFilter && currentTable === 'AUTO') {
            filterLabel.textContent = externalFilter.label;
            filterChip.style.display = 'inline-flex';
        } else {
            filterChip.style.display = 'none';
            filterLabel.textContent = '';
        }
    }
    filterClear.addEventListener('click', async () => {
        externalFilter = null;
        applyExternalFilterLabel();
        await loadTable('AUTO'); // neu rendern ohne externen Filter
    });

    // ----- Add-Formulare -----
    async function renderAddForms() {
        // AUTO
        formAuto.innerHTML = '';
        {
            const inName = document.createElement('input');
            inName.type = 'text'; inName.placeholder = 'Auto-Name (z. B. Golf)'; inName.id = 'auto-name';

            const selHer = document.createElement('select');
            selHer.id = 'auto-hersteller';
            const selBes = document.createElement('select');
            selBes.id = 'auto-besitzer';

            formAuto.appendChild(inName);
            formAuto.appendChild(selHer);
            formAuto.appendChild(selBes);

            // Optionen laden
            await refreshAutoSelects();
        }

        // HERSTELLER
        formHersteller.innerHTML = '';
        {
            const inName = document.createElement('input');
            inName.type = 'text'; inName.placeholder = 'Hersteller-Name'; inName.id = 'hersteller-name';
            formHersteller.appendChild(inName);
        }

        // BESITZER
        formBesitzer.innerHTML = '';
        {
            const inName = document.createElement('input');
            inName.type = 'text'; inName.placeholder = 'Besitzer-Name'; inName.id = 'besitzer-name';
            formBesitzer.appendChild(inName);
        }
    }

    async function refreshAutoSelects() {
        const selHer = document.getElementById('auto-hersteller');
        const selBes = document.getElementById('auto-besitzer');
        if (!selHer || !selBes) return;

        const [her, bes] = await Promise.all([
            fetch('/table/HERSTELLER').then(r => r.json()),
            fetch('/table/BESITZER').then(r => r.json())
        ]);

        // Caches füllen
        manufacturersCache.clear();
        ownersCache.clear();

        selHer.innerHTML = '';
        her.forEach(item => {
            manufacturersCache.set(item.Hersteller_ID, item.Name);
            const opt = document.createElement('option');
            opt.value = item.Hersteller_ID;
            opt.textContent = `${item.Hersteller_ID} – ${item.Name}`;
            selHer.appendChild(opt);
        });
        selBes.innerHTML = '';
        bes.forEach(item => {
            ownersCache.set(item.Besitzer_ID, item.Name);
            const opt = document.createElement('option');
            opt.value = item.Besitzer_ID;
            opt.textContent = `${item.Besitzer_ID} – ${item.Name}`;
            selBes.appendChild(opt);
        });
    }

    // Tabs
    function activateTab(entity) {
        addEntity = entity;
        tabButtons.forEach(b => b.classList.toggle('active', b.dataset.entity === entity));
        formAuto.style.display = (entity === 'AUTO') ? 'flex' : 'none';
        formHersteller.style.display = (entity === 'HERSTELLER') ? 'flex' : 'none';
        formBesitzer.style.display = (entity === 'BESITZER') ? 'flex' : 'none';
    }
    tabButtons.forEach(btn => {
        btn.addEventListener('click', async () => {
            activateTab(btn.dataset.entity);
            if (btn.dataset.entity === 'AUTO') await refreshAutoSelects();
        });
    });

    // Hinzufügen
    document.getElementById('add-btn').addEventListener('click', async () => {
        try {
            if (addEntity === 'AUTO') {
                const Name = (document.getElementById('auto-name').value || '').trim();
                const Hersteller_ID = parseInt(document.getElementById('auto-hersteller').value, 10);
                const Besitzer_ID = parseInt(document.getElementById('auto-besitzer').value, 10);
                if (!Name) return setMessage('Name darf nicht leer sein.', false);

                const res = await fetch('/add/auto', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ Name, Hersteller_ID, Besitzer_ID })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    return setMessage(err.detail || 'Fehler beim Hinzufügen (Auto).', false);
                }
                setMessage('Auto erfolgreich hinzugefügt.');
                if (currentTable === 'AUTO') await loadTable('AUTO');
                await refreshAutoSelects();

            } else if (addEntity === 'HERSTELLER') {
                const Name = (document.getElementById('hersteller-name').value || '').trim();
                if (!Name) return setMessage('Name darf nicht leer sein.', false);

                const res = await fetch('/add/hersteller', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ Name })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    return setMessage(err.detail || 'Fehler beim Hinzufügen (Hersteller).', false);
                }
                setMessage('Hersteller erfolgreich hinzugefügt.');
                if (currentTable === 'HERSTELLER') await loadTable('HERSTELLER');
                await refreshAutoSelects();

            } else if (addEntity === 'BESITZER') {
                const Name = (document.getElementById('besitzer-name').value || '').trim();
                if (!Name) return setMessage('Name darf nicht leer sein.', false);

                const res = await fetch('/add/besitzer', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ Name })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    return setMessage(err.detail || 'Fehler beim Hinzufügen (Besitzer).', false);
                }
                setMessage('Besitzer erfolgreich hinzugefügt.');
                if (currentTable === 'BESITZER') await loadTable('BESITZER');
                await refreshAutoSelects();
            }
        } catch (e) {
            console.error(e);
            setMessage('Unerwarteter Fehler beim Hinzufügen.', false);
        }
    });

    // ----- Checkboxes & Tabelle -----
    function renderCheckboxes(columns) {
        checkboxesDiv.innerHTML = '';
        columns.forEach(col => {
            const id = `cb-${col}`;
            const label = document.createElement('label');
            const cb = document.createElement('input');
            cb.type = 'checkbox'; cb.id = id; cb.checked = visibleColumns.includes(col);
            cb.addEventListener('change', () => {
                if (cb.checked) {
                    if (!visibleColumns.includes(col)) visibleColumns.push(col);
                } else {
                    visibleColumns = visibleColumns.filter(c => c !== col);
                    if (sortConfig.key === col) sortConfig = { key: null, direction: 'asc' };
                }
                renderTable();
            });
            label.appendChild(cb);
            label.appendChild(document.createTextNode(col));
            checkboxesDiv.appendChild(label);
        });
    }

    function makeCellLink(text, onClick) {
        const btn = document.createElement('button');
        btn.className = 'cell-link';
        btn.textContent = text;
        btn.addEventListener('click', onClick);
        return btn;
    }

    async function showAutosByManufacturer(herstellerId, nameText) {
        externalFilter = {
            key: 'Hersteller_ID',
            value: herstellerId,
            label: `Hersteller: ${nameText} (ID ${herstellerId})`
        };
        tableSelect.value = 'AUTO';
        await loadTable('AUTO');
        applyExternalFilterLabel();
    }
    async function showAutosByOwner(besitzerId, nameText) {
        externalFilter = {
            key: 'Besitzer_ID',
            value: besitzerId,
            label: `Besitzer: ${nameText} (ID ${besitzerId})`
        };
        tableSelect.value = 'AUTO';
        await loadTable('AUTO');
        applyExternalFilterLabel();
    }

    function renderTable() {
        // Kopfzeile
        theadRow.innerHTML = '';
        visibleColumns.forEach(col => {
            const th = document.createElement('th');
            th.textContent = col;
            th.title = 'Klicken zum Sortieren';
            th.addEventListener('click', () => {
                if (sortConfig.key === col) {
                    sortConfig.direction = (sortConfig.direction === 'asc') ? 'desc' : 'asc';
                } else {
                    sortConfig = { key: col, direction: 'asc' };
                }
                renderTable();
            });
            if (sortConfig.key === col) {
                const span = document.createElement('span');
                span.className = 'sort-indicator';
                span.textContent = sortConfig.direction === 'asc' ? '▲' : '▼';
                th.appendChild(span);
            }
            theadRow.appendChild(th);
        });
        // Aktionen
        const actTh = document.createElement('th');
        actTh.textContent = 'Aktionen';
        actTh.className = 'actions-col';
        theadRow.appendChild(actTh);

        // Filter & Sort
        const term = normalize(searchTerm);
        let filtered = rows;

        // Externer Filter nur für AUTO anwenden
        if (currentTable === 'AUTO' && externalFilter) {
            filtered = filtered.filter(r => r[externalFilter.key] === externalFilter.value);
        }

        if (term) {
            filtered = filtered.filter(r =>
                visibleColumns.some(col => normalize(r[col]).includes(term))
            );
        }
        if (sortConfig.key) {
            filtered = [...filtered].sort((a, b) => compare(a, b, sortConfig.key, sortConfig.direction));
        }

        // Body
        tbody.innerHTML = '';
        if (filtered.length === 0) {
            noDataDiv.style.display = 'block';
            return;
        } else {
            noDataDiv.style.display = 'none';
        }

        filtered.forEach(r => {
            const tr = document.createElement('tr');
            visibleColumns.forEach(col => {
                const td = document.createElement('td');
                const val = r[col];

                // Klickbare Namen:
                if (currentTable === 'HERSTELLER' && col === 'Name') {
                    // Hersteller-Name klickbar -> Autos dieses Herstellers
                    const id = r['Hersteller_ID'];
                    td.appendChild(makeCellLink(String(val), () => showAutosByManufacturer(id, String(val))));
                } else if (currentTable === 'BESITZER' && col === 'Name') {
                    // Besitzer-Name klickbar -> Autos dieses Besitzers
                    const id = r['Besitzer_ID'];
                    td.appendChild(makeCellLink(String(val), () => showAutosByOwner(id, String(val))));
                } else if (currentTable === 'AUTO' && col === 'Hersteller_ID') {
                    const id = r['Hersteller_ID'];
                    const name = manufacturersCache.get(id) ?? String(id);
                    td.appendChild(makeCellLink(`${name} (${id})`, () => showAutosByManufacturer(id, name)));
                } else if (currentTable === 'AUTO' && col === 'Besitzer_ID') {
                    const id = r['Besitzer_ID'];
                    const name = ownersCache.get(id) ?? String(id);
                    td.appendChild(makeCellLink(`${name} (${id})`, () => showAutosByOwner(id, name)));
                } else {
                    td.textContent = (val === null || val === undefined) ? '' : String(val);
                }

                tr.appendChild(td);
            });

            // Aktionen: Löschen
            const actTd = document.createElement('td');
            actTd.className = 'actions-col';
            const delBtn = document.createElement('button');
            delBtn.className = 'btn danger';
            delBtn.textContent = 'Löschen';
            delBtn.onclick = async () => {
                const pkName = PK[currentTable];
                const id = r[pkName];
                if (id == null) return setMessage('Kein Primärschlüssel gefunden.', false);
                let url = '';
                if (currentTable === 'AUTO') url = `/delete/auto/${id}`;
                if (currentTable === 'HERSTELLER') url = `/delete/hersteller/${id}`;
                if (currentTable === 'BESITZER') url = `/delete/besitzer/${id}`;
                const res = await fetch(url, { method: 'DELETE' });
                if (res.ok) {
                    setMessage('Eintrag erfolgreich gelöscht.');
                    await loadTable(currentTable);
                    await refreshAutoSelects(); // Listen aktuell halten
                } else {
                    const err = await res.json().catch(() => ({}));
                    setMessage(err.detail || 'Fehler beim Löschen.', false);
                }
            };
            actTd.appendChild(delBtn);
            tr.appendChild(actTd);

            tbody.appendChild(tr);
        });

        // Filter-Chip aktualisieren
        applyExternalFilterLabel();
    }

    // ----- Daten holen -----
    async function loadTable(name) {
        currentTable = name;

        // Wenn wir von AUTO weg wechseln, externen Filter entfernen
        if (currentTable !== 'AUTO') {
            externalFilter = null;
            applyExternalFilterLabel();
        }

        const res = await fetch(`/table/${encodeURIComponent(name)}`);
        if (!res.ok) {
            rows = []; visibleColumns = [];
            renderCheckboxes([]); renderTable();
            return;
        }
        rows = await res.json();

        // Standardspalten
        const columns = rows.length ? Object.keys(rows[0]) : (PK[name] ? [PK[name], 'Name'] : ['Name']);
        visibleColumns = [...columns];
        renderCheckboxes(columns);
        renderTable();
    }

    // Events
    tableSelect.addEventListener('change', (e) => loadTable(e.target.value));
    searchInput.addEventListener('input', debounce((e) => { searchTerm = e.target.value; renderTable(); }, 220));

    // Init
    window.addEventListener('DOMContentLoaded', async () => {
        const defaultTable = tableSelect.value || 'AUTO';
        await renderAddForms();
        // Caches gleich initial füllen (für klickbare Spalten in AUTO)
        await refreshAutoSelects();
        activateTab('AUTO');
        await loadTable(defaultTable);
    });
})();
</script>
</body>
</html>
